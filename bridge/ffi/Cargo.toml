[package]
name = "lumio-ffi"
edition = "2024"
# Let chains, stabilized in 1.88 (edition 2024 alone is not enough).
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["cavaldos"]
version = "0.1.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lumio-answers = { path = "../../core/answers" }
lumio-engine = { path = "../../core/engine" }
lumio-indexing = { path = "../../core/indexing" }
lumio-matching = { path = "../../core/matching" }
lumio-ranking = { path = "../../core/ranking" }
lumio-storage = { path = "../../core/storage" }
lumio-tools = { path = "../../core/tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

[profile.release]
# Smaller, faster static lib for the app bundle. Keep panic = "unwind": every
# export wraps its body in catch_unwind.
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

# Build scripts and proc-macros (serde_derive) are loaded by rustc as dylibs:
# stripping them breaks the load on macOS ("mis-aligned LINKEDIT").
[profile.release.build-override]
strip = false
