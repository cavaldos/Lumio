[package]
name = "lumio-perf-tools"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["cavaldos"]
version = "0.1.0"
publish = false
description = "Perf and stress benches for lumio's index refresh / watcher path. Not shipped in any app bundle."

[dependencies]
lumio-engine = { path = "../../core/engine" }
lumio-matching = { path = "../../core/matching" }
lumio-storage = { path = "../../core/storage" }
notify = "6"

[[bin]]
name = "query_engine_bench"
path = "query_engine_bench.rs"

[[bin]]
name = "scoped_refresh_bench"
path = "scoped_refresh_bench.rs"

[[bin]]
name = "watcher_stress"
path = "watcher_stress.rs"

[[bin]]
name = "real_fs_stress"
path = "real_fs_stress.rs"
